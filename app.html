<!DOCTYPE html>

    <style>
        /* ── Sidebar SVG icon styling ─────────────────────────────── */
        .nav-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-right: 0.65rem;
            opacity: 0.75;
            transition: opacity 150ms ease-in-out, transform 150ms ease-in-out;
        }
        .nav-item:hover svg,
        .nav-item.active svg {
            opacity: 1;
            transform: scale(1.05);
        }

        /* ── Sidebar user info ─────────────────────────────────── */
        .sidebar-user-section {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .sidebar-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.875rem;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-user-info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-user-name {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-user-email {
            font-size: 0.6875rem;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-signout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        .btn-signout:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
    </style>
</head>

            <!-- Sidebar User Info -->
            <div class="sidebar-user-section">

                <div class="sidebar-user-info">

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts — order matters: statistics must load before anomalyEngine -->
    <script src="js/statistics.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/transactions.js"></script>

    <script src="js/data.js"></script>
    <script src="js/anomalyEngine.js"></script>
    <script src="js/insights.js"></script>

    <script src="js/csv.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Auth guard + user info wiring for app.html
        (function() {
            const raw = localStorage.getItem('currentUser') || localStorage.getItem('aurelis_current_user');
            let user = null;
            if (raw) {
                try {
                    user = JSON.parse(raw);
                } catch (e) {
                    user = null;
                }
            }

            if (!user || !user.email) {
                window.location.replace('login.html');
                return;
            }

            // Populate sidebar + topbar with user info ASAP
            const sidebarName  = document.getElementById('sidebar-user-name');
            const sidebarEmail = document.getElementById('sidebar-user-email');
            const sidebarAvatar = document.getElementById('sidebar-avatar');
            const topbarAvatar  = document.getElementById('topbar-avatar');
            const signoutBtn    = document.getElementById('sidebar-signout-btn');

            if (sidebarName)  sidebarName.textContent  = user.name  || 'User';
            if (sidebarEmail) sidebarEmail.textContent = user.email || '';
            const initials = (user.name || 'U').charAt(0).toUpperCase();
            if (sidebarAvatar) sidebarAvatar.textContent = initials;
            if (topbarAvatar)  topbarAvatar.textContent  = initials;

            if (signoutBtn) {
                signoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('aurelis_current_user');
                    window.location.replace('index.html');
                });
            }
        })();
    </script>
</body>
</html>
